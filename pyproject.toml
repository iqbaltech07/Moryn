[project]
name = "moryn"
version = "3.0.0"
description = "Moryn AI Generation and Agentic Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "main:app"
